name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

  secrets-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true   # report-only: the NVD feed is slow without an API key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Dependency-Check
        run: mvn -B -DskipTests org.owasp:dependency-check-maven:12.1.3:aggregate -Dformat=HTML -DfailBuildOnCVSS=11
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  image-scan:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        module: [discovery-server, api-gateway, auth-service, ingestion-service, compliance-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg MODULE=${{ matrix.module }} -t edupulse/${{ matrix.module }}:ci .
      - name: Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: edupulse/${{ matrix.module }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
