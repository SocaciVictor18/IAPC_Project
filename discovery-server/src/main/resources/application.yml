server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: false
  client:
    # In a cluster every node registers with (and fetches from) its peers.
    register-with-eureka: ${EUREKA_REGISTER:false}
    fetch-registry: ${EUREKA_FETCH:false}
    service-url:
      defaultZone: ${EUREKA_PEERS:http://localhost:8761/eureka/}
  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    eviction-interval-timer-in-ms: 10000
    wait-time-in-ms-when-sync-empty: 0

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
