# Public entry point (plays the role of the AWS ALB): load-balances the two API gateways
# and serves the web UI.
events {
}

http {
    include /etc/nginx/mime.types;
    client_max_body_size 200m;

    upstream gateway {
        server api-gateway-1:8080;
        server api-gateway-2:8080;
    }

    server {
        listen 80;

        # Streaming answers (Server-Sent Events): send every token immediately, no buffering
        location = /api/compliance/ask/stream {
            proxy_pass http://gateway;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://gateway;
            proxy_read_timeout 300s;
        }

        location = /.well-known/jwks.json {
            proxy_pass http://gateway;
        }

        # Web UI
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
