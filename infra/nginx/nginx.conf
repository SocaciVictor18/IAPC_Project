# Public entry point (local stand-in for an AWS ALB): load-balances two Spring Cloud Gateway
# replicas and serves the demo UI. TLS would be terminated here in production (see docs/security.md).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    log_format main '$remote_addr - $request_method $request_uri $status $body_bytes_sent '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS

    upstream gateway {
        least_conn;
        server api-gateway-1:8080 max_fails=2 fail_timeout=10s;
        server api-gateway-2:8080 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 200m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # enable with TLS

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;

        # Server-Sent Events: no buffering so tokens reach the browser immediately.
        location = /api/compliance/ask/stream {
            proxy_pass http://gateway;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            add_header X-Accel-Buffering no;
        }

        location /api/ {
            proxy_pass http://gateway;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        location = /.well-known/jwks.json {
            proxy_pass http://gateway;
        }

        location /internal/ {
            return 404;
        }

        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
