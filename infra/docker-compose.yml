# EduPulse AI – full stack.
#   cp infra/.env.example infra/.env   (fill in OPENAI_API_KEY and the secrets)
#   docker compose -f infra/docker-compose.yml up -d --build
# Optional profiles:  --profile local-llm  (Ollama)   --profile observability  (Prometheus + Grafana)
# Scale-out demo:     docker compose -f infra/docker-compose.yml up -d --scale compliance-service=2 --scale ingestion-service=3

name: edupulse

x-service-env: &service-env
  EUREKA_URL: http://eureka-1:8761/eureka/,http://eureka-2:8762/eureka/
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: edupulse
  AUTH_JWKS_URI: http://auth-service:9001/.well-known/jwks.json
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in infra/.env}
  SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET:?set SERVICE_CLIENT_SECRET in infra/.env}
  LOG_FORMAT: ${LOG_FORMAT:-}

x-ai-env: &ai-env
  CHAT_PROVIDER: ${CHAT_PROVIDER:-openai}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-set}
  ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-opus-5-5}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  UTILITY_MODEL: ${UTILITY_MODEL:-gpt-4o-mini}
  EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1536}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 30s

x-build: &build
  context: ..
  dockerfile: Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: edupulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_admin_pw}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_app_pw}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:-ingestion_app_pw}
      COMPLIANCE_DB_PASSWORD: ${COMPLIANCE_DB_PASSWORD:-compliance_app_pw}
    ports:
      - "5433:5432"
    volumes:
      # For AES-256 at rest mount this on an encrypted volume (LUKS / BitLocker / RDS-KMS), see docs/security.md
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edupulse"]
      interval: 5s
      timeout: 5s
      retries: 30

  eureka-1:
    build: { <<: *build, args: { MODULE: discovery-server } }
    image: edupulse/discovery-server:latest
    restart: unless-stopped
    mem_limit: ${JAVA_MEM_LIMIT:-768m}
    hostname: eureka-1
    environment:
      SERVER_PORT: "8761"
      EUREKA_HOSTNAME: eureka-1
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_PEERS: http://eureka-2:8762/eureka/
    ports:
      - "8761:8761"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]

  eureka-2:
    image: edupulse/discovery-server:latest
    restart: unless-stopped
    mem_limit: ${JAVA_MEM_LIMIT:-768m}
    hostname: eureka-2
    depends_on: [eureka-1]
    environment:
      SERVER_PORT: "8762"
      EUREKA_HOSTNAME: eureka-2
      EUREKA_REGISTER: "true"
      EUREKA_FETCH: "true"
      EUREKA_PEERS: http://eureka-1:8761/eureka/
    ports:
      - "8762:8762"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8762/actuator/health"]

  auth-service:
    build: { <<: *build, args: { MODULE: auth-service } }
    image: edupulse/auth-service:latest
    restart: unless-stopped
    mem_limit: ${JAVA_MEM_LIMIT:-768m}
    depends_on:
      postgres: { condition: service_healthy }
      eureka-1: { condition: service_started }
    environment:
      <<: *service-env
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_app_pw}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-EduPulse#2026}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:9001/actuator/health"]

  ingestion-service:
    build: { <<: *build, args: { MODULE: ingestion-service } }
    image: edupulse/ingestion-service:latest
    restart: unless-stopped
    mem_limit: ${JAVA_MEM_LIMIT:-768m}
    depends_on:
      postgres: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    environment:
      <<: [*service-env, *ai-env]
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:-ingestion_app_pw}
      STORAGE_ROOT: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"   # JobRunr dashboard (background ingestion jobs)
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:9002/actuator/health"]

  compliance-service:
    build: { <<: *build, args: { MODULE: compliance-service } }
    image: edupulse/compliance-service:latest
    restart: unless-stopped
    mem_limit: ${JAVA_MEM_LIMIT:-768m}
    depends_on:
      postgres: { condition: service_healthy }
      ingestion-service: { condition: service_healthy }
    environment:
      <<: [*service-env, *ai-env]
      COMPLIANCE_DB_PASSWORD: ${COMPLIANCE_DB_PASSWORD:-compliance_app_pw}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-tei}
      RERANK_URL: http://tei-reranker:80
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:9003/actuator/health"]

  api-gateway-1:
    build: { <<: *build, args: { MODULE: api-gateway } }
    image: edupulse/api-gateway:latest
    restart: unless-stopped
    mem_limit: ${JAVA_MEM_LIMIT:-768m}
    depends_on: [eureka-1, eureka-2]
    environment:
      EUREKA_URL: http://eureka-1:8761/eureka/,http://eureka-2:8762/eureka/
      AUTH_JWKS_URI: http://auth-service:9001/.well-known/jwks.json
    ports:
      - "8080:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]

  api-gateway-2:
    image: edupulse/api-gateway:latest
    restart: unless-stopped
    mem_limit: ${JAVA_MEM_LIMIT:-768m}
    depends_on: [api-gateway-1]
    environment:
      EUREKA_URL: http://eureka-1:8761/eureka/,http://eureka-2:8762/eureka/
      AUTH_JWKS_URI: http://auth-service:9001/.well-known/jwks.json
    ports:
      - "8081:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]

  nginx:
    image: nginx:1.28
    restart: unless-stopped
    depends_on: [api-gateway-1, api-gateway-2]
    ports:
      - "${HTTP_PORT:-80}:80"   # set HTTP_PORT=8088 if port 80 is taken (e.g. Rancher Desktop's Traefik)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro

  tei-reranker:
    # Local cross-encoder (BAAI/bge-reranker-base) – downloads the model (~1 GB) on first start.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    mem_limit: 4g
    command: ["--model-id", "BAAI/bge-reranker-base", "--port", "80", "--tokenization-workers", "4"]
    ports:
      - "8089:80"
    volumes:
      - tei-data:/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    restart: unless-stopped
    # CPU inference would otherwise take every core and starve the JVMs (missed Eureka heartbeats).
    cpus: ${OLLAMA_CPUS:-8}
    environment:
      OLLAMA_NUM_PARALLEL: "2"
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  uploads:
  tei-data:
  ollama-data:
