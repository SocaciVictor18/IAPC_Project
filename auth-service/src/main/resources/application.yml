server:
  port: ${SERVER_PORT:9001}

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:edupulse}
    username: ${AUTH_DB_USER:auth_app}
    password: ${AUTH_DB_PASSWORD:auth_app_pw}
    hikari:
      maximum-pool-size: 10
  flyway:
    schemas: auth
    default-schema: auth
    create-schemas: false
  mvc:
    problemdetails:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

edupulse:
  crypto:
    data-key: ${DATA_ENCRYPTION_KEY}
  jwt:
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:PT30M}
    service-ttl: PT10M
  seed:
    enabled: ${SEED_ENABLED:true}
    default-password: ${SEED_DEFAULT_PASSWORD:EduPulse#2026}
    service-client-id: compliance-service
    service-client-secret: ${SERVICE_CLIENT_SECRET}

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
