server:
  port: ${SERVER_PORT:9001}

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:edupulse}
    username: ${AUTH_DB_USER:auth_app}
    password: ${AUTH_DB_PASSWORD:auth_app_pw}
  flyway:
    schemas: auth
    default-schema: auth
    create-schemas: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

edupulse:
  crypto:
    data-key: ${DATA_ENCRYPTION_KEY}
  jwt:
    access-ttl: PT60M
  seed:
    default-password: ${SEED_DEFAULT_PASSWORD:EduPulse#2026}

management:
  endpoints.web.exposure.include: health,info
